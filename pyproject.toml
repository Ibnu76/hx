[project]
name = "hx-cli"
version = "0.1.0"
description = "Personal CLI multitool — notes, reminders, scraping, calculations, daily automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Ibnu76"}]
dependencies = ["click>=8.1.0", "rich>=13.0.0"]

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.12.0", "httpx>=0.25.0"]

[project.scripts]
hx = "hx.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
